<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J.A.R.V.I.S.</title><meta name="theme-color" content="#000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22><circle cx=%225%22 cy=%225%22 r=%224%22 fill=%22%2300e5ff%22/></svg>">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="stage"></canvas>
<div id="boot"><h1>J.A.R.V.I.S.</h1><button id="initBtn">INITIALIZE</button><p>点击启动 · 解锁声音与麦克风</p></div>
<div id="dot" title="状态"></div>
<nav id="icons"><button id="convBtn" title="免按键对话">🎙️</button><button id="camBtn" title="摄像头手势">✋</button><button id="setBtn" title="设置">⚙️</button></nav>
<div id="sub"></div>
<input id="txt" placeholder="说话，或在这里打字回车" autocomplete="off">
<div id="win" hidden><div class="bar"><span id="winTitle"></span><a id="winExt" target="_blank" rel="noopener">↗</a><button id="winClose">✕</button></div><iframe id="winFrame" allow="camera; microphone; fullscreen; autoplay"></iframe></div>
<div id="settings" hidden><div class="dlg">
 <h3>设置</h3>
 <label>AI 服务商<select id="sProv"><option value="groq">Groq（默认，免费）</option><option value="gemini">Google Gemini（免费层）</option><option value="openrouter">OpenRouter（:free 模型）</option></select></label>
 <label>API Key（只存在本机浏览器）<input id="sKey" type="password" placeholder="粘贴你的 key"></label>
 <label>模型（留空用默认）<input id="sModel"></label>
 <label>声音<select id="sVoice"></select></label>
 <label>编程大师邮箱（说「交给编程大师…」时打开邮件草稿）<input id="sMail" type="email"></label>
 <div class="row"><button id="sTest">测试声音</button><button id="sClear">清空记忆</button><button id="sSave">保存</button><button id="sClose">关闭</button></div>
 <p class="hint">手势：手移动＝JARVIS 跟随 · 捏合拖动＝转动身体 · 张开手掌停 1 秒＝开/关聆听 · 👍＝确认</p>
</div></div>
<script src="app.js"></script>
<script type="module" src="figure.js"></script>
</body></html>
